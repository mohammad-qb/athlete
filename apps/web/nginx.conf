# One origin for the SPA and the API, mirroring Front Door: static files at /, the API
# at /api. The browser therefore never makes a cross-origin request, the session cookie
# is first-party, and the API needs no CORS.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Docker's embedded DNS, asked per request. A literal upstream is resolved once at
  # start-up, and nginx would refuse to start while the API container is still on its
  # way up (it restarts until the database has been migrated).
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $api http://api:3000;
    proxy_pass $api;
    # The API compares the Origin header with APP_BASE_URL; Host is passed through so
    # anything that reads it sees the origin the browser used.
    proxy_set_header Host $http_host;
    # A single address, replacing whatever the client sent: the sign-in rate limit
    # keys on it, and a client-supplied value must not choose its own bucket.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fingerprinted by the build: a changed file has a new name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Every other path is a client-side route: serve the app shell, never cached, so a
  # deploy is picked up on the next navigation.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
