packages:
  - 'apps/*'
  - 'packages/*'

# esbuild (vitest) and the Docker transport used by Testcontainers need their install
# scripts. Everything else stays script-free by default, which is the point of the
# allowlist: a new dependency cannot quietly run code at install time.
allowBuilds:
  esbuild: true
  protobufjs: true
  ssh2: true
  cpu-features: true
