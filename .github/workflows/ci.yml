name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, boundaries, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @athlete/config --filter @athlete/contracts run build

      - name: Typecheck
        run: pnpm run typecheck

      # Type-aware lint, and the reason it is a separate gate from typecheck: an
      # authorization assertion whose `await` has been deleted type-checks cleanly and
      # returns 200, so only `no-floating-promises` catches it. See
      # tooling/eslint-config/nest.js for the full argument.
      - name: Lint
        run: pnpm run lint

      # The architecture fitness check. A violated layer boundary fails the build.
      - name: Architecture boundaries
        run: pnpm run lint:boundaries

      - name: Unit tests
        run: pnpm --filter @athlete/api run test

      # Integration tests start a real Postgres via Testcontainers. The guarantees being
      # asserted (RLS, exclusion constraints, composite FKs) exist in the database, so
      # testing them against anything else would prove nothing.
      - name: Integration tests (Testcontainers + real Postgres)
        run: pnpm --filter @athlete/api run test:integration

  # Wiring check. Separate from `verify` because it exercises a different class of
  # defect: the integration suite asserts database guarantees directly and cannot catch
  # a middleware registered on a path that matches nothing, or a validator stricter than
  # the column it guards. Both of those happened; this job is why they were found.
  smoke:
    name: End-to-end smoke (containerised stack)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start the stack
        run: docker compose up -d --build
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: Run migrations as their own step
        run: docker compose run --rm migrate

      - name: Wait for the API
        run: |
          for i in $(seq 1 40); do
            curl -fsS http://localhost:3000/api/v1/health && exit 0
            sleep 3
          done
          echo "API did not become healthy"; docker compose logs api; exit 1

      - name: Smoke check
        run: ./scripts/smoke.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Static verification of infra/terraform. It never plans against Azure and never
  # applies: there is no subscription, and this job holds no cloud credential at all.
  # What it does prove is listed in infra/terraform/README.md under "What has been
  # verified" -- and so is what it does not.
  terraform:
    name: Terraform (fmt, validate, mocked plan, tflint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # Stacks are discovered, not listed, so a new stack cannot be left out. Modules
      # are validated through the stacks that call them.
      # -lockfile=readonly: a missing or stale .terraform.lock.hcl fails here instead
      # of being silently regenerated on the runner.
      - name: terraform validate (every stack)
        run: |
          for stack in $(find stacks -name versions.tf -not -path '*/.terraform/*' -exec dirname {} \; | sort); do
            echo "::group::validate $stack"
            terraform -chdir="$stack" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$stack" validate
            echo "::endgroup::"
          done

      # `terraform test` against a mocked azurerm provider: a full plan-time evaluation
      # (references, for_each keys, validation rules) with no API call.
      - name: terraform test (mocked provider, no credentials)
        run: |
          for dir in $(find modules stacks -type d -name tests -not -path '*/.terraform/*' -exec dirname {} \; | sort); do
            echo "::group::test $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.66.0

      # --config is not optional: in --recursive mode tflint looks for .tflint.hcl in
      # each directory it descends into, finds none, and falls back to the bundled
      # rules only -- which passes while the azurerm ruleset never runs.
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limiting on the ruleset download
        run: |
          tflint --init
          tflint --recursive --config "$(pwd)/.tflint.hcl"

  # Deployment shape, included to show the sequencing rather than to run here.
  #
  #  deploy:
  #    needs: verify
  #    environment: production        # manual approval gate
  #    permissions:
  #      id-token: write              # OIDC federated credential -- no stored secret
  #    steps:
  #      - azure/login@v2             # federated, no service-principal password
  #      - build + push image to ACR
  #      - run migrations as their OWN step, before the app deploy, never on container
  #        start: two booting replicas would otherwise race the same migration
  #      - deploy container app revision
  #      - smoke check /api/v1/health, roll back the revision on failure
