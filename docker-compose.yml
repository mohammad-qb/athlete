# Local development, and the literal answer to the brief's "the application must
# initially run on a single server" scenario: the same image, Postgres beside it, one
# box. No architectural change is required to go from here to Azure Container Apps or
# back again -- which is the point of having kept the deployable a plain container and
# the database vanilla Postgres.
#
#   docker compose up --build
#   docker compose run --rm migrate
#
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: athlete
    ports:
      # Published only so a developer can attach psql. Override when 5432 is already
      # taken on the host: POSTGRES_PORT=55432 docker compose up
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d athlete']
      interval: 5s
      timeout: 3s
      retries: 20

  # Migrations as a separate, explicit step -- mirroring the CI pipeline, where they
  # run before the app deploy rather than on container start.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/db/migrate.js']
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/athlete
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['tools']

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/athlete
      SESSION_SECRET: local-development-secret-at-least-32-chars
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
