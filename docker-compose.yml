# Local development, and the literal answer to the brief's "the application must
# initially run on a single server" scenario: the same image, Postgres beside it, one
# box. No architectural change is required to go from here to Azure Container Apps or
# back again -- which is the point of having kept the deployable a plain container and
# the database vanilla Postgres.
#
#   docker compose up --build
#   docker compose run --rm migrate
#   ./scripts/seed-dev.sh              # demo data and accounts to sign in with
#   open http://localhost:8080         # the SPA, with /api proxied to the API
#
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: athlete
    ports:
      # Published only so a developer can attach psql. Override when 5432 is already
      # taken on the host: POSTGRES_PORT=55432 docker compose up
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d athlete']
      interval: 5s
      timeout: 3s
      retries: 20

  # Migrations as a separate, explicit step -- mirroring the CI pipeline, where they
  # run before the app deploy rather than on container start.
  migrate:
    # The SAME image as `api`, by name. This service sits behind a profile, so
    # `up --build` does not rebuild it; with its own image tag, `run --rm migrate` kept
    # running whatever migrations were baked in the last time it happened to be built
    # and reported "Already up to date" against a newer tree.
    image: athlete/api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/db/migrate.js']
    environment:
      # Migrations run as the OWNER -- a different identity from the one that serves
      # requests, which is the whole privilege split.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/athlete
      # Local only: the migrations create `athlete_app` as NOLOGIN, and production
      # provisions its credential from Key Vault. Here the migrate step sets one so the
      # API has a non-superuser role it can actually connect as.
      APP_ROLE_PASSWORD: athlete-app-local-password
      # Likewise for `athlete_auth`, the role better-auth connects as.
      AUTH_ROLE_PASSWORD: athlete-auth-local-password
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['tools']

  api:
    image: athlete/api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '3000'
      # The application role: non-owner, NOBYPASSRLS, no DELETE on facts. The API checks
      # this at boot and refuses to start on the superuser URL the migrate step uses.
      DATABASE_URL: postgres://athlete_app:athlete-app-local-password@postgres:5432/athlete
      # The auth role: reads and writes users, sessions and password hashes, and holds
      # nothing on any tenant-owned table. better-auth alone connects with it.
      AUTH_DATABASE_URL: postgres://athlete_auth:athlete-auth-local-password@postgres:5432/athlete
      # The origin a browser sees: the `web` service below, which serves the SPA and
      # proxies /api here. It is the only origin whose state-changing requests are
      # accepted, so a browser pointed straight at the API's own port is refused.
      APP_BASE_URL: 'http://localhost:${WEB_PORT:-8080}'
      SESSION_SECRET: local-development-secret-at-least-32-chars
    ports:
      - '${API_PORT:-3000}:3000'
    # Until `migrate` has run there is no schema and no application role, and the API
    # refuses to start rather than serve from a database it cannot vouch for. It exits
    # and is retried, so `up` followed by `run --rm migrate` converges without a second
    # `up`.
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The SPA, and the single origin: static files at /, /api proxied to `api`. This is
  # the role Front Door plays in production (docs/05-deployment.md), reproduced locally
  # so the browser sees one origin here too -- first-party cookie, no CORS -- and so the
  # end-to-end tests exercise the same arrangement that ships.
  web:
    image: athlete/web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      - api

volumes:
  pgdata:
